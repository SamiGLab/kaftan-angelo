name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  intake-db:
    name: intake-db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kaftan_intake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaftan_intake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      recovery:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kaftan_recovery_test
        options: >-
          --health-cmd "pg_isready -U postgres -d kaftan_recovery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: kaftan_intake_test
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
      - name: Initialize disposable Supabase-style roles
        run: psql -X -v ON_ERROR_STOP=1 -f services/partner-intake/supabase/tests/roles.sql
      - name: Apply staging-only private intake schema
        run: psql -X -v ON_ERROR_STOP=1 -f services/partner-intake/supabase/migrations/20261016_private_intake.sql
      - name: Verify deny-by-default RLS, rate limits and durable idempotency
        run: psql -X -v ON_ERROR_STOP=1 -f services/partner-intake/supabase/tests/regression.sql
      - name: Apply staging-only 90-day non-converted enquiry retention
        run: psql -X -v ON_ERROR_STOP=1 -f services/partner-intake/supabase/migrations/20261016_90_day_retention.sql
      - name: Verify dry-run, 90-day expiry, signed preservation and RLS
        run: psql -X -v ON_ERROR_STOP=1 -f services/partner-intake/supabase/tests/retention-regression.sql
      - name: Install verified age encryption tool
        run: |
          curl --fail --silent --show-error --location https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz --output "$RUNNER_TEMP/age.tar.gz"
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP" age/age age/age-keygen
      - name: Test encrypted backup integrity and failure controls
        env:
          AGE_BIN: ${{ runner.temp }}/age/age
          AGE_KEYGEN_BIN: ${{ runner.temp }}/age/age-keygen
        run: python3 -m unittest discover -s services/recovery -p test_bundle.py -v
      - name: Rehearse encrypted recovery into separate disposable PostgreSQL
        env:
          AGE_BIN: ${{ runner.temp }}/age/age
          AGE_KEYGEN_BIN: ${{ runner.temp }}/age/age-keygen
          RECOVERY_REHEARSAL: synthetic-local-only
          RECOVERY_SOURCE_CONTAINER: ${{ job.services.postgres.id }}
          RECOVERY_TARGET_CONTAINER: ${{ job.services.recovery.id }}
        run: python3 services/recovery/rehearse.py

  build-test-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install verified secret scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Check current-source secrets and scanner controls
        run: node _dev/scripts/check-secrets.mjs
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
      - name: Test indexing audit and legacy restore compatibility
        run: python3 _dev/scripts/test_site_audit.py
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm run check:dependencies
      - name: Strict Astro source types
        run: npm run check:types
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: JavaScript correctness lint
        run: npm run check:lint
      - name: Test Lighthouse budget enforcement
        run: node --test _dev/scripts/lighthouse-budgets.test.mjs
      - name: Generate optimized images
        run: npm run optimize:images
      - name: Validate CMS content and uploaded images
        run: node _dev/scripts/validate-content.mjs
      - name: Test CMS authentication bridge
        run: node --test services/decap-auth/worker.test.mjs
      - name: Test partner security monitor
        run: node --test _dev/scripts/check-supabase-health.test.mjs
      - name: Test private partner contract handler
        run: node --test services/partner-security/contract-handler.test.mjs
      - name: Test partner intake validation
        run: node --test services/partner-intake/validation.test.mjs
      - name: Test partner intake fail-closed HTTP boundary
        run: node --test services/partner-intake/handler.test.mjs
      - name: Test partner intake server bot verification
        run: node --test services/partner-intake/turnstile.test.mjs
      - name: Test partner intake transactional notification transport
        run: node --test services/partner-intake/brevo.test.mjs
      - name: Test release recovery integrity
        run: node --test _dev/scripts/release-manifest.test.mjs
      - name: Install accessibility browser
        run: npx puppeteer browsers install chrome
      - name: Build Astro + Pagefind
        run: npm run build
      - name: Static SEO/link audit
        run: npm run audit:dist
      - name: Validate generated HTML
        run: npm run check:html
      - name: Check local links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir "$(pwd)/dist" --no-progress './dist/**/*.html'
          fail: true
      - name: Start accessibility server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/kaftan-http.log 2>&1 &
          echo $! > /tmp/kaftan-http.pid
          sleep 2
      - name: Check external-service privacy controls
        run: node _dev/scripts/test-privacy-controls.mjs
      - name: Check large collection browsing
        run: node _dev/scripts/test-collection-gallery.mjs
      - name: Check product photo and WhatsApp links
        run: node _dev/scripts/test-model-inquiries.mjs
      - name: Check responsive catalogue images and guide preloads
        run: node _dev/scripts/test-responsive-images.mjs
      - name: Check reversible colour variants
        run: node _dev/scripts/test-colour-variants.mjs
      - name: Check mobile contact and newsletter retry flows
        run: node _dev/scripts/test-contact-flows.mjs
      - name: Check HU/EN store-visit conversion CTAs on mobile
        run: node _dev/scripts/test-store-visit-ctas.mjs
      - name: Check disabled-by-default HU/EN partner intake preview
        run: node _dev/scripts/test-partner-intake-form.mjs
      - name: Check partner sessions and material isolation
        run: node _dev/scripts/test-partner-portal.mjs
      - name: Check analytics consent and partner exclusion
        run: node _dev/scripts/test-analytics-consent.mjs

      - name: WCAG 2 AA audit across sitemap
        run: npx pa11y-ci --config .pa11yci.cjs --sitemap http://127.0.0.1:4173/sitemap.xml --sitemap-find "https://kaftanangelo.com" --sitemap-replace "http://127.0.0.1:4173" --threshold 0
      - name: Stop accessibility server
        if: always()
        run: |
          if [ -f /tmp/kaftan-http.pid ]; then kill $(cat /tmp/kaftan-http.pid) || true; fi
      - name: Lighthouse performance budget
        run: npm run check:lighthouse
      - name: Keep Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
      - name: Fingerprint the tested release
        run: node _dev/scripts/release-manifest.mjs create dist "$GITHUB_SHA"
      - name: Keep a tested recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: site-release
          path: dist
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
      - name: Download the uploaded recovery snapshot
        uses: actions/download-artifact@v4
        with:
          name: site-release
          path: ${{ runner.temp }}/site-release-verified
      - name: Verify the actual recovery download before publishing
        run: |
          node _dev/scripts/release-manifest.mjs verify "$RUNNER_TEMP/site-release-verified" "$GITHUB_SHA"
          python3 _dev/scripts/site_audit.py "$RUNNER_TEMP/site-release-verified"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-test-upload, intake-db]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
