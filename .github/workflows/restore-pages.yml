name: Restore tested site release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Deploy GitHub Pages run ID (last 7 days)'
        required: true
        type: string
      deploy:
        description: 'Publish restored files. Leave unchecked for a recovery rehearsal.'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the source release is a successful main deployment
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.run_id }}
        with:
          script: |
            const id = process.env.SOURCE_RUN;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Invalid run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:id});
            if (run.path !== '.github/workflows/deploy-pages.yml' || run.head_branch !== 'main' || run.conclusion !== 'success' || !['push','workflow_dispatch'].includes(run.event)) throw new Error('Source must be a successful main site deployment');
            core.setOutput('sha', run.head_sha);
            core.summary.addHeading('Recovery source').addRaw(`Run ${id}, commit ${run.head_sha}`).write();
      - uses: actions/download-artifact@v4
        with:
          name: site-release
          path: restored-site
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test release recovery integrity
        run: node --test _dev/scripts/release-manifest.test.mjs
      - name: Verify every restored file
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: node _dev/scripts/release-manifest.mjs verify restored-site "$EXPECTED_SHA"
      - name: Verify local links and page metadata
        run: python3 _dev/scripts/site_audit.py restored-site
      - uses: actions/upload-pages-artifact@v4
        if: inputs.deploy
        with:
          path: restored-site
      - name: Recovery rehearsal result
        if: ${{ !inputs.deploy }}
        run: echo 'Recovery rehearsal passed; the live website was not changed.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: inputs.deploy
    needs: restore
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: publish
        uses: actions/deploy-pages@v4
