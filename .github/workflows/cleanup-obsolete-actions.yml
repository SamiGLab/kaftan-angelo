            const {owner, repo} = context.repo;
            if (owner !== 'SamiGLab' || repo !== 'kaftan-angelo') throw new Error('Unexpected repository');
            if (targets.length !== 89 || new Set(targets.map(x=>x.id)).size !== 89) throw new Error('Unexpected target list');
            const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state:'open', per_page:100});
            for (const pr of prs) protectedHeads.add(pr.head.sha);
            const deleted = [];
            for (const target of targets) {
              const {data:run} = await github.rest.actions.getWorkflowRun({owner,repo,run_id:target.id});
              if (run.name !== 'Site quality' || run.status !== 'completed' ||
                  !['failure','cancelled','timed_out','startup_failure'].includes(run.conclusion) ||
                  run.head_sha !== target.sha || protectedHeads.has(run.head_sha) ||
                  run.id === context.runId) throw new Error('Refused changed/protected run ' + target.id);
              await github.rest.actions.deleteWorkflowRun({owner,repo,run_id:target.id});
              deleted.push(target.id);
              core.info('Deleted obsolete Site quality #' + target.n + ': ' + target.id);
            }
            const remaining = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,per_page:100});
            const stillPresent = remaining.filter(run=>deleted.includes(run.id));
            if (stillPresent.length) throw new Error('Deleted runs still listed: ' + stillPresent.map(x=>x.id).join(','));
            await core.summary.addHeading('Obsolete quality-run cleanup')
              .addRaw('Deleted ' + deleted.length + ' obsolete failed runs. All active runs, successful runs, current open PR head checks and other workflows were preserved.')
              .write();
            core.setOutput('deleted_count', deleted.length);
