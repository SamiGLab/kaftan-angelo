name: External link monitor

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: external-link-monitor
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python _dev/scripts/test_external_links.py
      - run: npm ci
      - name: Generate the real page HTML
        run: npm run build
      - name: Check internal page and asset links
        run: python _dev/scripts/site_audit.py dist
      - name: Check external links over HTTP/1.1
        id: links
        continue-on-error: true
        timeout-minutes: 10
        run: python _dev/scripts/check_external_links.py dist
      - name: Maintain one confirmed broken-link issue
        if: always() && steps.links.outputs.broken != ''
        uses: actions/github-script@v7
        env:
          BROKEN: ${{ steps.links.outputs.broken }}
          UNVERIFIED: ${{ steps.links.outputs.unverified }}
        with:
          script: |
            const fs = require('fs');
            const title = 'Broken Link Report - Kaftan Angelo';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request &&
              i.user.login === 'github-actions[bot]' &&
              (i.title === title || i.title === '🚨 ' + title));
            if (Number(process.env.BROKEN) > 0) {
              const body = fs.readFileSync('link-report/report.md', 'utf8');
              if (existing) {
                if (existing.body !== body) await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, body
                });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body });
              }
            } else if (existing && Number(process.env.UNVERIFIED) === 0) {
              await github.rest.issues.update({
                ...context.repo, issue_number: existing.number, state: 'closed'
              });
            }
      - name: Keep the link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: link-report/
          retention-days: 7
      - name: Fail on confirmed broken links or checker failure
        if: always() && steps.links.outcome == 'failure'
        run: exit 1
