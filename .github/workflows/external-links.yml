name: External link monitor

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate the real page HTML
        run: npm run build
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        timeout-minutes: 10
        with:
          args: >-
            --exclude-all-private
            --no-progress
            --root-dir dist
            --scheme https
            --scheme http
            --timeout 45
            --max-retries 2
            --exclude '^https?://kaftanangelo\.com(?:/|$)'
            'dist/**/*.html'
          fail: true
          failIfEmpty: true
          jobSummary: true
      - name: Keep the link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: lychee/out.md
          retention-days: 7
