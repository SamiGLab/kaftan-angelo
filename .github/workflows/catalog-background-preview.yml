name: Catalog background preview

on:
  pull_request:
    paths:
      - '_dev/scripts/catalog-background-preview.py'
      - '.github/workflows/catalog-background-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview-only processing dependencies
        run: python -m pip install 'rembg[cpu]==2.0.67'
      - name: Render all catalog candidates
        run: python _dev/scripts/catalog-background-preview.py --output "$RUNNER_TEMP/catalog-background-review" --colour '#EFE4D2'
      - name: Upload original versus candidate review and files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-background-review
          path: ${{ runner.temp }}/catalog-background-review/
          if-no-files-found: warn
          retention-days: 7
